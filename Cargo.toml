[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The desktop app needs WebKitGTK/WebView2 to build; library crates build anywhere.
default-members = ["crates/*"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaspal/katabox"
rust-version = "1.99"

[workspace.dependencies]
kb-app = { path = "crates/kb-app" }
kb-core = { path = "crates/kb-core" }
kb-judge = { path = "crates/kb-judge" }
kb-pack = { path = "crates/kb-pack" }
kb-store = { path = "crates/kb-store" }
kb-runner = { path = "crates/kb-runner" }
kb-toolchain = { path = "crates/kb-toolchain" }
kb-bridge = { path = "crates/kb-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt"] }
# Test data in content.db (ADR 0018).
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# zstd level 19 builds content.db (ADR 0018); unoptimized C would make every debug
# `kb-pack validate`/`build` and the app's build script several times slower.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
