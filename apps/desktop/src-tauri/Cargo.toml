[package]
name = "katabox-desktop"
description = "KataBox desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Ehrlichmann Casas and KataBox contributors"]
# `tauri dev` / `cargo run` start the app, not the bindings exporter.
default-run = "katabox-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "katabox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Builds resources/content.db from content/problems (build.rs).
kb-pack.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
kb-app = { workspace = true, features = ["specta"] }
kb-bridge = { workspace = true, features = ["specta"] }
kb-core = { workspace = true, features = ["specta"] }
kb-store = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
# tauri-specta 2 is a release candidate: versions are pinned exactly (ADR 0011).
specta.workspace = true
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The app binary doubles as the Linux sandbox helper (hidden `__*` subcommands).
kb-runner.workspace = true

[lints]
workspace = true
