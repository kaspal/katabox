name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust crates (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libseccomp (kb-runner, ADR 0007)
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - name: Fetch pinned Python and Node toolchains (Linux attack suite)
        run: scripts/fetch-toolchains.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Includes the Linux attack suite: namespace mode runs; fallback tests assert the
      # refusal on kernels without Landlock ABI 6.
      - run: cargo test
      - name: Validate problem packages
        run: cargo run -p kb-pack -- validate
      - name: Build content.db
        run: cargo run -p kb-pack -- build --out target/content.db

  sandbox-windows:
    name: Sandbox attack suite + judge (Windows)
    # Same minutes policy as the Windows desktop job: main only until the repo is public.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Also fetches the pinned language servers into target/katabox/tools (ADR 0014).
      - name: Fetch pinned Python, Node, PHP and Rust toolchains and language servers
        run: pwsh scripts/fetch-toolchains.ps1
      - run: cargo clippy -p kb-runner -p kb-judge -p kb-store -p kb-bridge --all-targets -- -D warnings
      - run: cargo test -p kb-runner -- --nocapture
      # Judge end-to-end tests on two-sum (Python, TypeScript, PHP, Rust in the sandbox).
      - run: cargo test -p kb-judge
      # Includes recording a real two-sum judge Report in user.db.
      - run: cargo test -p kb-store
      # Run and Submit on two-sum through the app service (kb-app), every language.
      - run: cargo test -p kb-app
      # Language servers through the bridge: lifecycle with a fake server, and basedpyright,
      # typescript-language-server and rust-analyzer for real (completion, diagnostics).
      - run: cargo test -p kb-bridge
      # Every reference solution, every language, through the judge (content pipeline).
      - run: cargo run -p kb-pack -- validate --run

  sandbox-linux:
    name: Sandbox attack suite (Linux, both modes)
    # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which is
    # exactly the case fallback mode exists for.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libseccomp
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - name: Fetch pinned Python toolchain
        run: scripts/fetch-toolchains.sh
      - run: cargo clippy -p kb-runner --all-targets --features unscoped-fallback-for-tests -- -D warnings
      - name: Probe (user namespaces restricted)
        run: cargo run -q -p kb-runner --bin kb-sandbox -- probe
      # The runner kernel is older than 6.12 (no Landlock signal scoping), so the product
      # refuses fallback; the test-only feature lets the suite exercise its other layers.
      - name: Fallback mode + Auto picks fallback
        run: >
          cargo test -p kb-runner --features unscoped-fallback-for-tests --test attacks_linux
          -- --nocapture fallback auto_mode probe
      - name: Fallback refused without the test feature
        run: cargo test -p kb-runner --test attacks_linux -- --nocapture fallback
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Probe (user namespaces allowed)
        run: cargo run -q -p kb-runner --bin kb-sandbox -- probe
      - name: Namespace mode + Auto picks namespaces
        run: cargo test -p kb-runner --test attacks_linux -- --nocapture namespaces auto_mode

  licenses:
    name: License check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      # npm packages against the same allow-list idea (scripts/check-npm-licenses.mjs).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check

  ui:
    name: UI build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Vitest + Testing Library: library, i18n, theme, palette, token contrast (ADR 0012).
      - run: pnpm test

  desktop:
    name: Desktop shell (${{ matrix.os }})
    # Private repos have limited Actions minutes and Windows minutes count double:
    # run Windows only on main until the repo is public.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-22.04","windows-latest"]') || fromJSON('["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libseccomp-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # build.rs also builds resources/content.db from content/problems.
      - run: cargo clippy -p katabox-desktop --all-targets -- -D warnings
      - name: TypeScript bindings are up to date
        run: |
          cargo run -p katabox-desktop --bin export-bindings
          git diff --exit-code apps/desktop/src/bindings.ts
