name: Release

# Builds the installers and attaches them to a DRAFT GitHub release (ADR 0021).
# Runs only for a version tag (`v1.0.0-beta.1`) or by hand; never on normal pushes or PRs.
# Follow docs/release-checklist.md before pushing a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the draft release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # NSIS (per-user) and MSI
            bundles: nsis,msi
          # Linux is not released yet (Windows first, then Linux, then going public).
          # To build it again, add back:
          #   - platform: ubuntu-22.04 # glibc baseline for .deb, .rpm and AppImage
          #     bundles: deb,rpm,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install WebKitGTK and libseccomp (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libseccomp-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The three version fields agree and the MSI version follows docs/packaging.md.
      - run: pnpm versions:check

      # Third-party notices are bundled; a release build refuses to ship without them.
      - run: pnpm notices

      # Complexity profiles (ADR 0024): their inputs are not committed. Generate them from
      # gen.py in the sandbox and verify them against the committed hashes, so content.db
      # carries every profile. (Linux installers ship without profiles until sandboxed
      # problem scripts run on Linux.)
      - name: Profile inputs (Windows)
        if: runner.os == 'Windows'
        run: |
          pwsh scripts/fetch-toolchains.ps1 -NoLanguageServers
          cargo run --release -p kb-pack -- profile --inputs

      # --- Code signing (off until the repo is public; docs/packaging.md) ---------------
      # SignPath Foundation signs the Windows installers after the build: add the
      # signpath/github-action-submit-signing-request step here with the organization id,
      # project slug and signing policy from SignPath, and the SIGNPATH_API_TOKEN secret.

      - name: Build installers (draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Auto-update (off; maintainer-steps in docs/packaging.md) ---------------
          # When enabled, add the signing key secrets and the build args below:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # Add `--features updater --config src-tauri/tauri.updater.conf.json` to turn
          # auto-update on (and set includeUpdaterJson: true).
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: KataBox ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}
          releaseBody: See CHANGELOG.md. Installers are unsigned until code signing is set up.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false
