id = "dfs"
subject = "graphs"
order = 3
title = "Depth-first search"
title_es = "Búsqueda en profundidad (DFS)"
tags = ["graph", "dfs"]
problems = ["mutual-reach"]
presets = ["deep-branch", "random", "grid-like"]
default = [8, 0, 0, 1, 1, 1, 2, 1, 2, 3, 1, 3, 4, 1, 0, 5, 1, 5, 6, 1, 6, 7, 1, 2, 6, 1]

[complexity]
best = "O(n + m)"
