id = "quick-sort-3way"
subject = "sorting"
order = 7
title = "Quick Sort: Hoare and 3-way"
title_es = "Ordenación rápida: Hoare y en tres partes"
tags = ["comparison-sort", "divide-and-conquer", "duplicates"]
problems = ["three-bins"]
presets = ["random", "nearly-sorted", "reversed", "few-unique"]
default = [27, 43, 27, 9, 82, 27, 55, 9, 64, 43]

[complexity]
best = "O(n)"
average = "O(n log n)"
