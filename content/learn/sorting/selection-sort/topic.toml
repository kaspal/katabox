id = "selection-sort"
subject = "sorting"
order = 4
title = "Selection Sort"
title_es = "Ordenación por selección"
tags = ["comparison-sort"]
problems = ["fun-run-results", "medal-table"]
presets = ["random", "nearly-sorted", "reversed", "few-unique"]
default = [38, 27, 43, 3, 9, 82, 10, 55, 21, 64]

[complexity]
best = "O(n²)"
average = "O(n²)"
worst = "O(n²)"
