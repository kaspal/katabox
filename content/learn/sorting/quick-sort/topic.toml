id = "quick-sort"
subject = "sorting"
order = 3
title = "Quick Sort"
title_es = "Ordenación rápida (Quick Sort)"
tags = ["comparison-sort", "divide-and-conquer"]
problems = ["medal-table", "biggest-number", "score-ranks"]
presets = ["random", "nearly-sorted", "reversed", "few-unique"]
default = [38, 27, 43, 3, 9, 82, 10, 55, 21, 64]

[complexity]
best = "O(n log n)"
average = "O(n log n)"
worst = "O(n²)"
space = "O(log n)"
stable = false
in_place = true

[input]
min_len = 2
max_len = 16
min = 1
max = 99

# The call the sample check makes on the array `a` (ADR 0029).
[sample]
python = "quick_sort(a, 0, len(a) - 1)"
typescript = "quickSort(a, 0, a.length - 1)"
