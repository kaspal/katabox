id = "merge-sort"
subject = "sorting"
order = 6
title = "Merge Sort"
title_es = "Ordenación por mezcla (Merge Sort)"
tags = ["comparison-sort", "divide-and-conquer"]
problems = ["steep-drops", "checkout-merge"]
presets = ["random", "nearly-sorted", "reversed", "few-unique"]
default = [38, 27, 43, 3, 9, 82, 10, 55, 21, 64]

[complexity]
best = "O(n log n)"
average = "O(n log n)"
worst = "O(n log n)"
space = "O(n)"
stable = true
in_place = false

[input]
min_len = 2
max_len = 16
min = 1
max = 99

# The call the sample check makes on the array `a` (ADR 0029).
[sample]
python = "merge_sort(a, 0, len(a) - 1)"
typescript = "mergeSort(a, 0, a.length - 1)"
