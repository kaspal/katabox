id = "rolling-hash"
subject = "hashing"
order = 4
title = "Rolling hash"
title_es = "Hash rodante"
tags = ["hashing", "strings"]
problems = ["repeated-chunk"]
presets = ["repeat", "random", "words"]
default = [3, 0, 1, 2, 0, 1, 2, 0, 1]

[complexity]
best = "O(n)"
average = "O(n) for all windows"
worst = "O(n)"
space = "O(1) extra"
