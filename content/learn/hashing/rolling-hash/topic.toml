min = -1
max = 25

# The call the sample check makes on the array `a` (ADR 0029).
[sample]
python = "a = window_hashes(kb_text(a[1:])[0], a[0])"
typescript = "a = windowHashes(kbText(a.slice(1))[0], a[0])"
