id = "bst-operations"
subject = "trees"
order = 3
title = "BST: search, insert, delete"
title_es = "ABB: buscar, insertar, borrar"
tags = ["bst", "binary-tree"]
problems = ["catalogue-check", "kth-smallest-code"]
presets = ["delete-with-two-children", "random", "skewed"]
default = [1, 50, 1, 30, 1, 70, 1, 60, 1, 80, 1, 65, 3, 50, 2, 65, 2, 50]

[complexity]
best = "O(log n) balanced"
average = "O(h) per operation"
worst = "O(n) skewed"
space = "O(n)"
stable = true
in_place = true

[input]
min_len = 2
max_len = 32
min = 1
max = 99

# The call the sample check makes on the array `a` (ADR 0029).
[sample]
python = "a = run(kb_ops(a, [\"insert\", \"find\", \"delete\"], 1))"
typescript = "a = run(kbOps(a, [\"insert\", \"find\", \"delete\"], 1))"
