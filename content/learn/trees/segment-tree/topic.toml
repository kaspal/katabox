[sample]
python = "a = run(a[1:1 + a[0]], kb_ops(a[1 + a[0]:], [\"sum\", \"update\"], 2))"
typescript = "a = run(a.slice(1, 1 + a[0]), kbOps(a.slice(1 + a[0]), [\"sum\", \"update\"], 2))"
