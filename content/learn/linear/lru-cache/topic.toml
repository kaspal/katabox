id = "lru-cache"
subject = "linear"
order = 9
title = "LRU cache"
title_es = "Caché LRU"
tags = ["cache", "linked-list"]
problems = ["recent-pages", "popular-pages"]
presets = ["lru-thrash", "random", "hits-keep-it"]
default = [2, 2, 1, 10, 2, 2, 20, 1, 1, 0, 2, 3, 30, 1, 2, 0, 1, 3, 0, 1, 1, 0]

[complexity]
best = "O(1)"
average = "O(1) per operation"
worst = "O(1)"
space = "O(capacity)"
stable = true
in_place = false

[input]
min_len = 4
max_len = 37
min = 0
max = 99

# The call the sample check makes on the array `a` (ADR 0029).
[sample]
python = "a = run(a[0], kb_ops(a[1:], [\"get\", \"put\"], 2))"
typescript = "a = run(a[0], kbOps(a.slice(1), [\"get\", \"put\"], 2))"
