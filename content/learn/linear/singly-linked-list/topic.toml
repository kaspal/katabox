id = "singly-linked-list"
subject = "linear"
order = 5
title = "Singly linked list"
title_es = "Lista simplemente enlazada"
tags = ["linked-list", "pointers"]
problems = ["split-the-train", "playlist-rotation", "two-queues-merge"]
presets = ["build-and-delete", "random", "delete-missing"]
default = [2, 12, 2, 25, 1, 7, 2, 31, 3, 25, 1, 3, 3, 3]

[complexity]
best = "O(1) at the front"
average = "O(n) at the back or by value"
worst = "O(n)"
space = "O(n)"
stable = true
in_place = true

[input]
min_len = 2
max_len = 24
min = 1
max = 99

# The call the sample check makes on the array `a` (ADR 0029).
[sample]
python = "a = run(kb_ops(a, [\"front\", \"back\", \"delete\"], 1))"
typescript = "a = run(kbOps(a, [\"front\", \"back\", \"delete\"], 1))"
