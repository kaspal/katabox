id = "cheapest-route"
title = "Cheapest Route"
title_es = "La ruta más barata"
difficulty = "hard"
tags = ["graph", "heap", "shortest-path"]
pattern = "graphs"
rank = 10
profile = true
profile_sizes = [100, 300, 1000, 3000, 10000, 20000]

[signature]
name = "cheapestRoute"
params = [{ name = "n", type = "int" }, { name = "roads", type = "int[][]" }, { name = "start", type = "int" }, { name = "goal", type = "int" }]
returns = "int"

[judge]
checker = "exact"
time_limit_ms = 300 # base (Rust); other languages scale it (ADR 0017)
memory_mb = 256
