id = "mileage-log"
title = "Mileage Log"
title_es = "Registro de kilómetros"
difficulty = "easy"
tags = ["prefix-sum", "array"]
pattern = "range-queries"
rank = 1
profile = true
profile_sizes = [300, 1000, 3000, 10000, 30000, 100000]

[signature]
name = "tripTotals"
params = [{ name = "miles", type = "int[]" }, { name = "trips", type = "int[][]" }]
returns = "int[]"

[judge]
checker = "exact"
time_limit_ms = 300 # base (Rust); other languages scale it (ADR 0017)
memory_mb = 256
