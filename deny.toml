# cargo-deny configuration: `cargo deny check licenses` (run in CI).
# KataBox is MIT OR Apache-2.0; dependencies must be compatible with that.

[graph]
all-features = true
# The platforms KataBox ships on (ADR 0015). Others (wasm32, Android, Apple) are never
# built, so their target-only dependencies are not checked.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", # Inflector, via specta-macros (ADR 0011)
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # ring, rustls-webpki, untrusted (TLS for toolchain downloads, ADR 0015): permissive.
    "ISC",
    # Weak copyleft, file-level (Tauri's dependency tree).
    "MPL-2.0",
]
exceptions = [
    # Approved exception (ADR 0007): the Linux sandbox. The linking exception allows
    # static linking into the MIT/Apache app; changes to hakoniwa itself stay LGPL.
    { allow = ["LGPL-3.0-only WITH LGPL-3.0-linking-exception"], crate = "hakoniwa" },
]
