[package]
name = "kb-judge"
description = "Harness generation, checkers and the judge for KataBox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
# Dev command: `kb-judge run <problem> --lang <python|typescript|php|rust> <file>`.
name = "kb-judge"
path = "src/bin/kb-judge.rs"

[dependencies]
kb-core.workspace = true
kb-runner.workspace = true
minijinja = { version = "3.1", default-features = false, features = ["builtins", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
toml.workspace = true

[lints]
workspace = true
