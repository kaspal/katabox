[package]
name = "kb-app"
description = "KataBox app service: state, judging orchestration and typed errors behind the Tauri commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kb-bridge.workspace = true
kb-core.workspace = true
kb-judge.workspace = true
kb-runner.workspace = true
kb-store.workspace = true
kb-toolchain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
# Packs (expansion M11, ADR 0038): the same checks as built-in content.
kb-pack.workspace = true

[features]
# TypeScript bindings for the desktop app (tauri-specta).
specta = ["dep:specta", "kb-core/specta", "kb-store/specta", "kb-bridge/specta", "kb-toolchain/specta", "kb-pack/specta"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
