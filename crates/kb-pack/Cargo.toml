[package]
name = "kb-pack"
description = "Validate and build KataBox problem packs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kb-pack"
path = "src/main.rs"

[dependencies]
kb-core.workspace = true
kb-judge.workspace = true
kb-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
# The pins kb-toolchain already uses (Cargo.lock); packs are zips (expansion M11).
# flate2's default features pick its pure-Rust backend for zip's deflate.
flate2 = "1.1.11"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
sqlx.workspace = true
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
