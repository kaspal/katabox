[package]
name = "kb-runner"
description = "Sandboxed execution of user code with time, memory and process limits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
# Manual test command: `kb-sandbox run --toolchain <dir> -- python -c "print(1)"`.
name = "kb-sandbox"
path = "src/bin/kb-sandbox.rs"

[dependencies]
kb-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Linux sandbox (ADR 0007). hakoniwa is LGPL-3.0-only WITH LGPL-3.0-linking-exception
# (approved exception); its `seccomp` feature links libseccomp (runtime dep: libseccomp2).
[target.'cfg(target_os = "linux")'.dependencies]
hakoniwa = { version = "=1.8.1", default-features = false, features = ["landlock", "seccomp"] }
landlock = "=0.4.7"
nix = { version = "0.29", features = ["fs", "mount", "process", "resource", "sched", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[features]
# TEST ONLY. Lets the attack suite exercise fallback mode on kernels without Landlock
# signal scoping (ABI < 6), where the product refuses fallback. Never enable in the app;
# see ADR 0007.
unscoped-fallback-for-tests = []

[lints]
workspace = true
