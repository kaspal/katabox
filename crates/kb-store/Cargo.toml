[package]
name = "kb-store"
description = "SQLite storage: content.db (read-only packs) and user.db (progress)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kb-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Only for tests/judge_windows.rs (a real judge Report); the library does not use them.
kb-judge.workspace = true
kb-runner.workspace = true
tokio = { workspace = true, features = ["macros"] }

[features]
# TypeScript bindings for the desktop app (tauri-specta).
specta = ["dep:specta", "kb-core/specta"]

[lints]
workspace = true
