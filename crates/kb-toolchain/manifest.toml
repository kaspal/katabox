# --- Languages -----------------------------------------------------------------------
# What the user picks. `runtime` is what the judge runs; `servers` is what the language
# server needs. A language is available on a platform when all its components are.

[[language]]
id = "python"
runtime = ["python"]
servers = ["node", "basedpyright"]

[[language]]
id = "typescript"
runtime = ["node"]
servers = ["typescript", "typescript-language-server"]

[[language]]
id = "php"
runtime = ["php"]
servers = []

[[language]]
id = "rust"
runtime = ["rust"]
servers = ["rust-src", "rust-analyzer"]
