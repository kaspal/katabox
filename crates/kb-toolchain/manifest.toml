# KataBox toolchain manifest (ADR 0015): every artifact the app may download, pinned per
# app version and compiled into the binary. This is the only place pins live: the app,
# the `kb-toolchain` CLI and scripts/fetch-toolchains.* all install from it.
#
# Changing a pin: take URL, size and SHA-256 from the upstream checksum list (named per
# artifact below), then run the real-pins test (KB_REAL_PINS=1 cargo test -p kb-toolchain
# --test real_pins -- --nocapture) and record the results. A pin that was never actually
# downloaded and matched must not ship.

schema = 1

# The only hosts the downloader talks to, https on port 443 only. Redirects must stay
# within this list (GitHub release assets and windows.php.net redirect).
hosts = [
    "github.com",
    "release-assets.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "windows.php.net",
    "downloads.php.net",
    "static.rust-lang.org",
    "registry.npmjs.org",
]

