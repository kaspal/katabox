# --- Components ----------------------------------------------------------------------
# One folder each under the sandbox root, always replaced as a whole (ADR 0015).
# A source extracts `subtree` of an artifact (other entries are ignored), minus
# `exclude`, or exactly one `member` (with its own sha256). `links`: in-archive symlinks
# copied as files; `skip_links`: symlinks left out (a trailing `/` is a prefix). Any
# other link fails the install.

[[component]]
id = "python"
platform = "windows-x86_64"
dest = "toolchains/python-3.14"
check = "python.exe"
installed_size = 156611145
[[component.source]]
artifact = "python-windows-x86_64"
subtree = "python"

