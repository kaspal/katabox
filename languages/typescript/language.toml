# Runtime definition for typescript. Templates (minijinja, embedded by kb-judge):
# stub.ts.j2 (starter code for the editor) and harness.ts.j2 (runs the tests).
# Node strips types itself (no type checking, ADR 0008). The --preserve-symlinks flags
# stop Node from lstat-ing every parent folder up to the drive root, which the Windows
# sandbox denies.
id = "typescript"
extension = "ts"
compile = ""
run = "node --preserve-symlinks --preserve-symlinks-main --max-old-space-size={memory_mb} {main}"
language_server = "typescript-language-server"
# The debugger's replay run (ADR 0022, 0023): the same Node, with debug.ts.j2 stepping the
# solution through the in-process inspector (no port).
debug = "node --preserve-symlinks --preserve-symlinks-main --max-old-space-size={memory_mb} {main}"
debug_adapter = "replay (debug.ts.j2, ADR 0023)"

# Time limit for this language (ADR 0017): the problem's base limit (`time_limit_ms`,
# set for Rust) times `factor`, plus `startup_ms` of CPU for starting the runtime and
# loading the harness, which the user does not control.
[time]
factor = 2
startup_ms = 500
