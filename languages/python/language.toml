# Runtime definition for python. Templates (minijinja, embedded by kb-judge):
# stub.py.j2 (starter code for the editor) and harness.py.j2 (runs the tests).
id = "python"
extension = "py"
compile = ""
run = "python -I -X utf8 {main}"
# The debugger's replay runs (ADR 0022): `-P -s` instead of `-I` so PYTHONHASHSEED=0
# (set by kb-judge) applies; kb-runner gives the child no other environment.
debug = "python -P -s -X utf8 {main}"
language_server = "basedpyright"
debug_adapter = "replay (debug.py.j2, ADR 0022)"

# Time limit for this language (ADR 0017): the problem's base limit (`time_limit_ms`,
# set for Rust) times `factor`, plus `startup_ms` of CPU for starting the runtime and
# loading the harness, which the user does not control.
[time]
factor = 10
startup_ms = 1000
